name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# TODO#0 ✅: Declare workflow permissions (principle of least privilege)
# Each scanner only gets the access it actually needs.
permissions:
  contents: read
  # TODO#0a ✅: SARIF upload to Security tab
  security-events: write
  # TODO#0b ✅: Gitleaks/Sonar comment on PRs + issues
  pull-requests: write
  issues: write
  # TODO#0c ✅: OIDC token (some actions use it for keyless auth)
  id-token: write
  actions: read


jobs:
    # GATE#0: Secret scanning (TruffleHog + Gitleaks)
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#1 ✅: fetch-depth: 0 → full git history so scanners can
                # diff base..HEAD across ALL commits (secrets may hide in old commits).
                fetch-depth: 0

            # TruffleHog = verifies live creds by calling APIs (lower false positives,
            # but may miss non-verifiable patterns like private RSA keys without a known host)
            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              continue-on-error: true
              with:
                path: ./
                # TODO#2 ✅: scan only the diff (faster than scanning whole repo every run)
                base: ${{ github.event.repository.default_branch }}
                head: HEAD
                # TODO#3 ✅: --only-verified → report ONLY creds TruffleHog could verify live
                extra_args: --only-verified

            # Gitleaks = regex-based. Catches anything matching a pattern
            # (including commented-out secrets), but can't tell if a cred is live.
            # TODO#4 ✅: Gitleaks step with SARIF upload + job summary enabled
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
                GITLEAKS_ENABLE_SUMMARY: true

    # GATE#1a: SAST via SonarQube
    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#5 ✅: Sonar uses git blame for new-code detection → needs full history
                fetch-depth: 0

            # TODO#6 ✅: SonarQube scan — uploads to SonarCloud dashboard (NOT Security tab,
            # because Sonar is a separate platform with its own UI, rules, quality gates)
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v7.1.0
              continue-on-error: true
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # GATE#1b: SAST via CodeQL (results go to GitHub Security tab)
    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        strategy:
            matrix:
                # TODO#7 ✅: Next.js/React = JavaScript + TypeScript
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                languages: ${{ matrix.language }}
                # TODO#8 ✅: both suites — extended finds vulns, quality finds maintainability issues
                queries: security-extended,security-and-quality

            # TODO#9 ✅: analyze step with category (so matrix runs don't overwrite each other)
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:${{ matrix.language }}"

    # GATE#2: Dependency scanning via OWASP Dependency-Check
    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#10 ✅: Node 20 so Depcheck can resolve the full npm tree
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            # TODO#11 ✅: install deps (Depcheck needs node_modules/ + lockfile)
            - name: Install dependencies
              run: npm install

            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@main
              continue-on-error: true
              id: Depcheck
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.'
                # TODO#12 ✅: SARIF = format the GitHub Security tab understands
                format: 'SARIF'
                out: 'reports'
                # TODO#13 ✅: CVSS 7.0+ = HIGH → fail the build on HIGH or CRITICAL
                args: >
                    --failOnCVSS 7
                    --enableRetired

            # TODO#14 ✅: upload SARIF to Security tab
            - name: Upload Depcheck SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: reports/dependency-check-report.sarif
                category: dependency-check

            # TODO#15 ✅: upload raw report folder as a downloadable artifact
            - name: Upload Depcheck HTML report as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: depcheck-report
                path: reports/

    # GATE#3: Container/Image scanning via Trivy
    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#16 ✅: build the image BEFORE Trivy can scan it
            - name: Build Docker image
              run: docker build -t my-app:latest .

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@master
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                # TODO#17 ✅: SARIF for Security tab
                format: 'sarif'
                output: 'trivy-results.sarif'
                # TODO#18 ✅: only alert on CRITICAL + HIGH — LOW/MEDIUM in base images
                # are near-infinite; flagging all of them causes alert fatigue and
                # gets ignored. Block builds only on issues that actually matter.
                severity: 'CRITICAL,HIGH'
                # TODO#19 ✅: skip CVEs with no fix available — can't patch what doesn't exist,
                # so surfacing them creates noise. (Trade-off: you lose visibility into
                # long-tail CVEs you might want to monitor or mitigate via workarounds.)
                ignore-unfixed: true

            # TODO#20 ✅: upload Trivy SARIF to Security tab
            - name: Upload Trivy SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: trivy-results.sarif
                category: trivy

            # TODO#21 ✅: upload raw SARIF as a downloadable artifact
            - name: Upload Trivy SARIF as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-sarif
                path: trivy-results.sarif

    # GATE#4: IaC scanning — skipped (no infrastructure code in this repo)
    # GATE#5: DAST — skipped (covered in separate OWASP ZAP workshop)